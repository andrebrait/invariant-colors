<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title description">
  <title id="title">Invariant Colors plus Invariant Highlighter equals Invariant Complete</title>
  <desc id="description">The Invariant Colors icon plus the Invariant Highlighter icon equals the Invariant Complete icon.</desc>
  <defs>
    <clipPath id="invariant-top"><rect x="8" y="11" width="24" height="7" rx="1.5"/></clipPath>
    <clipPath id="invariant-bottom"><rect x="8" y="22" width="24" height="7" rx="1.5"/></clipPath>
    <linearGradient id="highlighter-brace" x1="0" y1="9" x2="0" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff007f"/>
      <stop offset="0.333" stop-color="#ff007f"/>
      <stop offset="0.333" stop-color="#52e3f6"/>
      <stop offset="0.666" stop-color="#52e3f6"/>
      <stop offset="0.666" stop-color="#a7ec21"/>
      <stop offset="1" stop-color="#a7ec21"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="798" height="258" rx="28" fill="#121314" stroke="#2c2d2f" stroke-width="2"/>

  <g transform="translate(28 30) scale(4)">
    <circle cx="20" cy="20" r="18" fill="#191a1c"/>
    <g clip-path="url(#invariant-top)">
      <rect x="8" y="11" width="8" height="7" fill="#ff007f"/>
      <rect x="16" y="11" width="8" height="7" fill="#52e3f6"/>
      <rect x="24" y="11" width="8" height="7" fill="#a7ec21"/>
    </g>
    <g clip-path="url(#invariant-bottom)">
      <rect x="8" y="22" width="8" height="7" fill="#ff007f"/>
      <rect x="16" y="22" width="8" height="7" fill="#52e3f6"/>
      <rect x="24" y="22" width="8" height="7" fill="#a7ec21"/>
    </g>
  </g>

  <text x="250" y="110" fill="#cfbfad" font-family="system-ui, sans-serif" font-size="56" font-weight="600" text-anchor="middle" dominant-baseline="middle">+</text>

  <g transform="translate(312 30) scale(4)">
    <circle cx="20" cy="20" r="18" fill="#191a1c"/>
    <path d="M16 9 C12 9 12 12 12 15 C12 18 10 19.5 8 20 C10 20.5 12 22 12 25 C12 28 12 31 16 31"
          fill="none" stroke="url(#highlighter-brace)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 9 C28 9 28 12 28 15 C28 18 30 19.5 32 20 C30 20.5 28 22 28 25 C28 28 28 31 24 31"
          fill="none" stroke="url(#highlighter-brace)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="542" y="110" fill="#cfbfad" font-family="system-ui, sans-serif" font-size="56" font-weight="600" text-anchor="middle" dominant-baseline="middle">=</text>

  <g transform="translate(612 30) scale(4)">
    <circle cx="20" cy="20" r="18" fill="#191a1c"/>
    <path d="M14 9 C10 9 10 12 10 15 C10 18 8 19.5 6 20 C8 20.5 10 22 10 25 C10 28 10 31 14 31"
          fill="none" stroke="#ff007f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 9 C30 9 30 12 30 15 C30 18 32 19.5 34 20 C32 20.5 30 22 30 25 C30 28 30 31 26 31"
          fill="none" stroke="#a7ec21" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 16.5 H24 M16 23.5 H24" fill="none" stroke="#52e3f6" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <g fill="#cfbfad" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <text x="108" y="228">Invariant Colors</text>
    <text x="392" y="228">Invariant Highlighter</text>
    <text x="692" y="228">Invariant Complete</text>
  </g>
</svg>
