name: JetBrains CI

# Full verification is expensive and only needs to run when JetBrains package inputs
# change. Runs on master also warm the Gradle caches restored by release tags.

on:
  push:
    branches: [master]
    paths:
      - 'jetbrains/**'
      - 'assets/icon.svg'
      - '.github/workflows/ci-jetbrains.yml'
  pull_request:
    paths:
      - 'jetbrains/**'
      - 'assets/icon.svg'
      - '.github/workflows/ci-jetbrains.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetbrains-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.7.0
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: gradle -p jetbrains buildPlugin verifyPlugin --configuration-cache
